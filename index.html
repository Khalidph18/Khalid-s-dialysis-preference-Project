<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقييم الأفضلية للعلاج الأمثل للمريض</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white rounded-xl shadow-lg overflow-hidden border border-gray-200">
    <!-- Header Banner -->
    <div class="bg-emerald-800 text-white p-6 text-center">
      <h2 class="text-lg font-bold mb-1">تذكر دائماً: الحل الأمثل لحالتك هو الزراعة</h2>
      <p class="text-sm opacity-90">إذا لم تكن متاحة، يجب عليك المحافظة على حياتك بانتخاب طريقة الغسيل المثلى لتتمتع بحياة أفضل.</p>
    </div>

    <!-- Main Content Card -->
    <div class="p-6 text-center">
      <h1 class="text-2xl font-extrabold text-gray-800 mb-2">تقييم الأفضلية للعلاج الأمثل للمريض</h1>
      <p class="text-sm text-gray-500 mb-6">درجات التقييم من 1 إلى 5: (1 غير مرضي، 2 مرضي، 3 جيد، 4 جيد جداً، 5 ممتاز)</p>

      <!-- Patient Input Form -->
      <form id="evaluationForm" onsubmit="handleStartEvaluation(event)" class="space-y-4">
        <div>
          <input
            type="text"
            id="patientName"
            placeholder="ادخل اسم المريض (اختياري)"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg text-center focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:border-transparent"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg transition duration-200 shadow-md"
        >
          بدء التقييم
        </button>
      </form>

      <!-- Navigation Link -->
      <div class="mt-6">
        <a href="#doctor-dashboard" class="text-xs text-gray-400 hover:text-emerald-700 underline">
          لوحة تحكم الطبيب/المشرف
        </a>
      </div>
    </div>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    // 1. Corrected Supabase Configuration
    const SUPABASE_URL = "https://bhzyifhxammbtwudprqg.supabase.co";
    const SUPABASE_KEY = "sb_publishable_RnJsAcc9aE7ZYnGp_QFX1Q_9hctVOJ2";

    // 2. Initialize Supabase Client once using window scope
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

    // 3. Form Submission Handler
    function handleStartEvaluation(event) {
      event.preventDefault();
      const patientName = document.getElementById('patientName').value.trim();
      
      alert(`مرحباً ${patientName || "عزيزي المريض"}! سيتم بدء التقييم الآن.`);
      
      // Add your survey / evaluation logic or database save here:
      // if (supabaseClient) { ... }
    }
  </script>

</body>
</html>
